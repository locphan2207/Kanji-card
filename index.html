<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kanji Drill Card</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<div class="table">
  <div class="stage" id="stage">
    <div class="drop" aria-hidden="true"></div>
    <div class="dealer" id="dealer">
      <button class="card" id="card" aria-live="polite"
              aria-label="Kanji card. Activate to turn it over.">
        <div class="face front">
          <div class="no"></div>
          <div class="glyph"></div>
          <ol class="vocab"></ol>
          <div class="related"></div>
          <div class="code"></div>
          <div class="strip"></div>
          <div class="turn" aria-hidden="true">裏</div>
        </div>
        <div class="face back">
          <div class="no"></div>
          <div class="bk-k"></div>
          <div class="bk-m"></div>
          <hr>
          <div class="bk-groups"></div>
        </div>
      </button>
    </div>
  </div>

  <div class="piles">
    <div class="pile used" id="usedPile" aria-hidden="true">
      <div class="stack"></div>
      <span class="mark">済</span>
      <span class="tag">済み <b id="usedN">0</b></span>
    </div>
    <button class="pile draw" id="drawPile" aria-label="Draw pile. Activate to draw a card.">
      <div class="stack"></div>
      <span class="mark">漢</span>
      <span class="tag">山札 <b id="drawN">0</b></span>
    </button>
  </div>
</div>

<div class="controls">
  <div class="hint" id="hint"></div>
</div>
<script src="data/cards.js"></script>
<script src="src/app.js"></script>
</body>
</html>

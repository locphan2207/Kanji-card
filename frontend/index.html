<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kana &amp; Kanji Drill Card</title>
<!-- What a search result and a shared link say about the page. The script draws
     everything below the head, so a crawler or a link preview that does not run it
     sees only this. The image is the card itself, lying on the desk. -->
<meta name="description" content="Free Japanese drill cards modelled on a real 漢字ドリル: all 2,524 JLPT kanji from N5 to N1 and the whole kana syllabary, with stroke order and example words. No sign-up.">
<link rel="canonical" href="https://kanjicard.app/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kana &amp; Kanji Drill Card">
<meta property="og:title" content="Kana &amp; Kanji Drill Card">
<meta property="og:description" content="All 2,524 JLPT kanji from N5 to N1 and the whole kana syllabary, with stroke order. Free, no sign-up.">
<meta property="og:url" content="https://kanjicard.app/">
<meta property="og:image" content="https://kanjicard.app/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A kanji drill card for 右: the character, six example words, cross-referenced kanji and a stroke-order strip.">
<meta name="twitter:card" content="summary_large_image">
<!-- The icon is a blank card with 字 on it; the manifest is what lets a phone keep the
     table on its home screen and open it without the browser around it. -->
<link rel="icon" type="image/png" sizes="32x32" href="img/favicon-32.png">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap">
<link rel="stylesheet" href="src/styles.css">
<!-- The colour the phone paints its own chrome, so the desk carries on past the page.
     It is the desk's top stop; app.js restates it whenever the room changes. -->
<meta name="theme-color" id="themeColor" content="#D6D1C4">
<!-- Before first paint, and so before the stylesheet has decided anything: a remembered
     choice has to be on <html> already, or a dark room opens as a flash of a light one.
     That is the theme's reason and the theme's alone — nothing is on screen to animate
     until app.js has drawn the chooser, so a remembered `data-motion` could perfectly
     well be set down there. It is here because the two are one kind of thing, and a pair
     of remembered choices restored in two different places is how one of them ends up
     restored in neither. Everything else about either switch is in app.js; this is only
     the part that cannot wait for a script at the end of the body. -->
<script>
  (function () {
    var el = document.documentElement;
    try {
      var t = localStorage.getItem("drill-card:theme");
      if (t === "light" || t === "dark") el.dataset.theme = t;
      var m = localStorage.getItem("drill-card:motion");
      if (m === "full" || m === "none") el.dataset.motion = m;
    } catch (e) {}   /* a store that will not open leaves the system's choice standing */
  })();
</script>
</head>
<body>

<!-- Two switches on the wall of the room the cards are in, rather than anything on the
     table. A theme changes the desk and the other switch changes how the cards get from
     one place to another; neither is a property of the deck on the table, so both sit
     off it and stay put across both screens. The lamp keeps the corner it has always
     had, and the new one is set beside it. -->
<div class="room">
  <button class="sw" id="motion" type="button">
    <span class="sw-mark" id="motionMark"></span>
    <span class="sw-name" id="motionName"></span>
  </button>
  <button class="sw" id="lamp" type="button">
    <span class="sw-mark" id="lampMark"></span>
    <span class="sw-name" id="lampName"></span>
  </button>
</div>

<!-- Shown until a deck is picked; each deck is a separate download. -->
<div class="chooser" id="chooser">
  <div class="chooser-box">
    <p class="chooser-kicker">かなドリル・漢字ドリル</p>
    <h1 class="chooser-title">Pick a deck</h1>
    <p class="chooser-sub">The whole syllabary, and every kanji the JLPT lists place —
      the jōyō set and 388 more. The deck is shuffled every time you start one.</p>
    <div class="groups" id="groupList"></div>
    <p class="chooser-note" id="chooserNote"></p>
  </div>
</div>

<!-- Two kinds of card, because they ask different questions. A kanji card asks which
     reading each compound uses, and needs a front dense enough to ask it. A kana card
     asks only what one character sounds like, so its front is the character and how to
     write it; everything else is the answer, and the answer is on the back.

     The band at the head of each face is the one thing all four faces share: the 和柄
     the deck's box is printed with, so a card in the hand says which box it came out
     of. It is stock, not content, so it carries no text and is hidden from a reader. -->
<template id="tplKanji">
  <div class="face front">
    <div class="band wagara" aria-hidden="true"></div>
    <div class="no"></div>
    <div class="glyph"></div>
    <ol class="vocab"></ol>
    <div class="related"></div>
    <div class="code"></div>
    <div class="strip"></div>
    <div class="turn" aria-hidden="true">裏</div>
  </div>
  <div class="face back">
    <div class="band wagara" aria-hidden="true"></div>
    <div class="no"></div>
    <div class="bk-k"></div>
    <div class="bk-m"></div>
    <hr>
    <div class="bk-groups"></div>
  </div>
</template>

<template id="tplKana">
  <div class="face front kn">
    <div class="band wagara" aria-hidden="true"></div>
    <div class="no"></div>
    <div class="kn-glyph"></div>
    <div class="strip"></div>
    <div class="turn" aria-hidden="true">裏</div>
  </div>
  <div class="face back kn">
    <div class="band wagara" aria-hidden="true"></div>
    <div class="no"></div>
    <div class="kn-c"></div>
    <div class="kn-rom"></div>
    <div class="kn-alt"></div>
    <hr>
    <div class="kn-body">
      <div class="kn-facts"></div>
      <div class="kn-words"></div>
    </div>
    <div class="kn-note"></div>
  </div>
</template>

<div class="table" id="table" hidden>
  <div class="stage" id="stage">
    <div class="drop" aria-hidden="true"></div>
    <div class="dealer" id="dealer">
      <button class="card" id="card" aria-live="polite"
              aria-label="Drill card. Activate to turn it over."></button>
    </div>
  </div>

  <div class="piles">
    <button class="pile used" id="usedPile"
            aria-label="Discard pile. Activate to take the last card back.">
      <div class="stack"></div>
      <span class="mark">済</span>
      <!-- the count is part of rendering a pile, so renderPile finds it inside the pile
           rather than by an id of its own -->
      <span class="tag">済み <b>0</b></span>
    </button>
    <button class="pile draw" id="drawPile" aria-label="Draw pile. Activate to draw a card.">
      <div class="stack"></div>
      <span class="mark">山</span>
      <span class="tag">山札 <b>0</b></span>
    </button>
  </div>
</div>

<div class="controls" id="controls" hidden>
  <div class="hint" id="hint"></div>
  <button class="relevel" id="relevel">change deck</button>
</div>
<script src="data/decks.js"></script>
<script src="src/app.js"></script>
</body>
</html>
